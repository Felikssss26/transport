<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2430">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Транспорт">
<title>Транспорт</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#eef1f5;--card:#fff;--text:#1c2430;--muted:#6b7686;--line:#e2e6ec;--in:#1f9d55;--out:#e0792a;--danger:#c93c3c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{height:100dvh}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
    display:flex;flex-direction:column;max-width:640px;margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom)}
  header{position:relative;background:#1c2430;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 8px 10px 16px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .hr{display:flex;align-items:center;gap:4px}
  #mBtn{border:0;background:none;color:#fff;font-size:26px;line-height:1;width:44px;height:44px;border-radius:22px;cursor:pointer;font-weight:700}
  #mBtn:active{background:rgba(255,255,255,.15)}
  .menu{display:none;position:absolute;right:8px;top:calc(100% - 4px);z-index:20;background:#fff;color:var(--text);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);min-width:240px;overflow:hidden}
  .menu.open{display:block}
  .menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:15px 18px;font-size:16px;font-weight:600;color:var(--text);cursor:pointer;border-bottom:1px solid var(--line)}
  .menu button:last-child{border-bottom:0}
  .menu button:active{background:var(--bg)}
  .menu .clr{color:var(--danger)}
  #install{display:none}
  header .ttl{font-weight:700;font-size:17px}
  header .dt{font-size:12px;opacity:.7}
  #clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .panel{background:var(--card);padding:12px 16px 14px;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06)}
  input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font-size:18px;background:#fff;color:var(--text);outline:none}
  input:focus{border-color:#2a5bd7}
  #plate{font-size:26px;font-weight:800;letter-spacing:2px;text-transform:uppercase;text-align:center}
  #org{margin-top:10px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .big{border:0;border-radius:16px;padding:22px 8px;font-size:24px;font-weight:800;color:#fff;cursor:pointer;letter-spacing:1px}
  .big:active{transform:scale(.97);filter:brightness(.9)}
  #bIn{background:var(--in)} #bOut{background:var(--out)}
  #toast{min-height:22px;margin-top:8px;font-size:15px;font-weight:600;text-align:center}
  .ok{color:var(--in)} .err{color:var(--danger)}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:14px;color:var(--muted)}
  .bar b{color:var(--text)}
  #list{flex:1;overflow-y:auto;padding:0 12px 12px}
  .row{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-left:6px solid var(--in)}
  .row.done{border-left-color:#b8c0cc}
  .row .main{flex:1;min-width:0}
  .pl{font-size:20px;font-weight:800;letter-spacing:1px}
  .og{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tm{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;line-height:1.4}
  .tm .i{color:var(--in);font-weight:700} .tm .o{color:var(--out);font-weight:700}
  .tm .nn{color:#a0a8b4;font-weight:700}
  .tm .inside{color:var(--in);font-weight:700;font-size:12px}
  .x{border:0;background:none;color:#a0a8b4;font-size:20px;padding:6px;cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<header>
  <div><div class="ttl">🚚 Учёт транспорта</div><div class="dt" id="dt"></div></div>
  <div class="hr">
    <div id="clock">--:--</div>
    <button id="mBtn" aria-label="Меню">⋮</button>
  </div>
  <div class="menu" id="menu">
    <button id="install">📲 Установить приложение</button>
    <button id="bSave">⬇ Сохранить в Excel</button>
    <button id="bClear" class="clr">🗑 Очистить день</button>
  </div>
</header>


<div class="bar"><span>На территории: <b id="cNow">0</b></span><span>Записей: <b id="cAll">0</b></span></div>
<div id="list"></div>

<div class="panel">
  <input id="plate" placeholder="ГОСНОМЕР" autocomplete="off" autocapitalize="characters" list="dlPlates" enterkeyhint="done">
  <input id="org" placeholder="Организация (необязательно)" autocomplete="off" list="dlOrgs">
  <datalist id="dlPlates"></datalist><datalist id="dlOrgs"></datalist>
  <div class="btns">
    <button class="big" id="bIn">ВЪЕЗД</button>
    <button class="big" id="bOut">ВЫЕЗД</button>
  </div>
  <div id="toast"></div>
</div>

<script>
const KEY='vehicle_log_app_v1';
let log=[];
try{log=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){log=[]}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(log))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dm=ts=>{const d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1)};
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
const norm=s=>s.toUpperCase().replace(/\s+/g,'');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;
function toast(t,ok){
  const e=$('toast');e.textContent=t;e.className=ok?'ok':'err';
  clearTimeout(tt);tt=setTimeout(()=>e.textContent='',4000);
  if(navigator.vibrate)navigator.vibrate(ok?40:[80,60,80]);
}
const inside=p=>log.find(r=>r.plate===p&&!r.out);

function reset(){$('plate').value='';$('org').value='';if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}

$('bIn').onclick=()=>{
  const p=norm($('plate').value);
  if(!p)return toast('Введите госномер');
  if(inside(p))return toast(p+' уже на территории');
  log.push({id:Date.now()+Math.random(),plate:p,org:$('org').value.trim(),in:Date.now(),out:null});
  save();toast('ВЪЕЗД '+p+' — '+hm(Date.now()),true);reset();render(true);
};
$('bOut').onclick=()=>{
  const p=norm($('plate').value);
  if(!p)return toast('Введите госномер');
  const r=inside(p);
  if(!r){
    log.push({id:Date.now()+Math.random(),plate:p,org:$('org').value.trim(),in:null,out:Date.now()});
    save();toast('ВЫЕЗД '+p+' — '+hm(Date.now())+' (въезд не отмечен)',true);reset();render(true);return;
  }
  r.out=Date.now();
  const o=$('org').value.trim();if(o&&!r.org)r.org=o;
  save();toast('ВЫЕЗД '+p+' — '+hm(r.out),true);reset();render();
};
$('mBtn').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open');};
document.addEventListener('click',e=>{if(!$('menu').contains(e.target))$('menu').classList.remove('open');});
$('menu').addEventListener('click',()=>$('menu').classList.remove('open'));
$('plate').addEventListener('input',()=>{
  const p=norm($('plate').value);
  const k=[...log].reverse().find(r=>r.plate===p&&r.org);
  if(k&&!$('org').value)$('org').value=k.org;
});
$('plate').addEventListener('keydown',e=>{if(e.key==='Enter')(inside(norm($('plate').value))?$('bOut'):$('bIn')).click();});

function pick(id){
  const r=log.find(x=>String(x.id)===String(id));if(!r)return;
  $('plate').value=r.plate;$('org').value=r.org||'';
}
function del(id,ev){
  ev.stopPropagation();
  if(!confirm('Удалить эту запись?'))return;
  log=log.filter(r=>String(r.id)!==String(id));save();render();
}

function render(toEnd){
  const now=log.filter(r=>!r.out).length;
  $('cNow').textContent=now;$('cAll').textContent=log.length;
  const key=r=>r.in??r.out;
  const items=[...log].sort((a,b)=>key(a)-key(b));
  $('list').innerHTML=items.length?items.map(r=>`
    <div class="row ${r.out?'done':''}" onclick="pick('${r.id}')">
      <div class="main"><div class="pl">${esc(r.plate)}</div><div class="og">${esc(r.org)||'&nbsp;'}</div></div>
      <div class="tm">
        <div>${r.in?`<span class="i">▶ ${hm(r.in)}</span>${sameDay(r.in,Date.now())?'':' <small>'+dm(r.in)+'</small>'}`:'<span class="nn">▶ —</span>'}</div>
        <div>${r.out?'<span class="o">■ '+hm(r.out)+'</span>':'<span class="inside">на территории</span>'}</div>
      </div>
      <button class="x" onclick="del('${r.id}',event)">✕</button>
    </div>`).join(''):'<div class="empty">Пока нет записей</div>';
  if(toEnd){const l=$('list');l.scrollTop=l.scrollHeight;}
  $('dlPlates').innerHTML=[...new Set(log.map(r=>r.plate))].map(v=>`<option value="${esc(v)}">`).join('');
  $('dlOrgs').innerHTML=[...new Set(log.map(r=>r.org).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('');
}

function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
function exportCsv(){
  const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
  const key=r=>r.in??r.out;
  const rows=[...log].sort((a,b)=>key(a)-key(b));
  let csv='№;Госномер;Организация;Дата;Въезд;Выезд\r\n';
  rows.forEach((r,i)=>{csv+=[i+1,q(r.plate),q(r.org),dm(r.in??r.out)+'.'+new Date(r.in??r.out).getFullYear(),r.in?hm(r.in):'',r.out?hm(r.out):''].join(';')+'\r\n';});
  const d=new Date();
  download('transport_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');
}
$('bSave').onclick=()=>{if(!log.length)return toast('Список пуст');exportCsv();};
$('bClear').onclick=()=>{
  if(!log.length)return toast('Список уже пуст');
  const left=log.filter(r=>!r.out).length;
  let msg='Очистить весь список ('+log.length+' записей)?';
  if(left)msg+='\n\nВнимание: на территории ещё '+left+' машин(ы) без отметки выезда.';
  msg+='\n\nЭто нельзя отменить. Сначала можно нажать «Сохранить в файл».';
  if(!confirm(msg))return;
  log=[];save();render();toast('День очищен',true);
};

function tick(){
  const d=new Date();
  $('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  $('dt').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
}
tick();setInterval(tick,15000);render(true);
if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();

let deferredPrompt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
if(!isStandalone())$('install').style.display='block';
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
$('install').onclick=async()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    const r=await deferredPrompt.userChoice;
    deferredPrompt=null;
    if(r.outcome==='accepted')toast('Приложение устанавливается…',true);
  }else{
    alert('Откройте меню браузера (⋮) и выберите «Установить приложение» или «Добавить на главный экран».\n\nВажно: нужен именно пункт «Установить приложение», а не «Добавить ярлык» — иначе откроется в браузере. Старый ярлык с главного экрана сначала удалите.');
  }
};
window.addEventListener('appinstalled',()=>{$('install').style.display='none';toast('Приложение установлено',true);});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
